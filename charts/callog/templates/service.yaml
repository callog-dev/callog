apiVersion: v1
kind: Service
metadata:
  name: {{ include "callog.fullname" . }}-api
  labels:
    {{- include "callog.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "callog.componentSelectorLabels" (dict "root" $ "role" "api") | nindent 4 }}
